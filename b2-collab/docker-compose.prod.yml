services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: b2-collab-app:latest
    volumes: !override
      - app_public:/var/www/public
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    env_file:
      - .env
    restart: always

  nginx:
    ports: !override
      - "${APP_HTTP_PORT:-80}:80"
    volumes: !override
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    restart: always

  mysql:
    ports: !override []
    restart: always

  vite:
    profiles: ["dev"]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: b2-collab-app:latest
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes: !override
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    env_file:
      - .env
    restart: always

volumes:
  app_public:
  app_storage:
