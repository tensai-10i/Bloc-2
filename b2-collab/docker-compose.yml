services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: b2-collab-app:dev
    volumes:
      - .:/var/www/html
      # Use the vendor/node_modules baked into the image, not the host's
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: b2-collab-app:dev
    entrypoint: []
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - app_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: b2-collab-app:dev
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - app_network

volumes:
  mysql_data:
  app_storage:

networks:
  app_network:
    driver: bridge
