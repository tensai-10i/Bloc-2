name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - preprod
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        type: choice
        options:
          - preprod
          - production

concurrency:
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      compose_target: ${{ steps.resolve.outputs.compose_target }}
      compose_override: ${{ steps.resolve.outputs.compose_override }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
    steps:
      - name: Resolve target
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            TARGET="production"
          else
            TARGET="preprod"
          fi

          case "$TARGET" in
            production)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "compose_target=prod-up-build" >> "$GITHUB_OUTPUT"
              echo "compose_override=prod" >> "$GITHUB_OUTPUT"
              echo "git_ref=main" >> "$GITHUB_OUTPUT"
              ;;
            preprod)
              echo "environment=preprod" >> "$GITHUB_OUTPUT"
              echo "compose_target=preprod-up-build" >> "$GITHUB_OUTPUT"
              echo "compose_override=preprod" >> "$GITHUB_OUTPUT"
              echo "git_ref=preprod" >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    name: Deploy (${{ needs.resolve-environment.outputs.environment }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    if: ${{ needs.resolve-environment.result == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout "${{ needs.resolve-environment.outputs.git_ref }}"
            git pull origin "${{ needs.resolve-environment.outputs.git_ref }}"

            cd b2-collab
            make ${{ needs.resolve-environment.outputs.compose_target }}

            docker compose -f docker-compose.yml -f docker-compose.${{ needs.resolve-environment.outputs.compose_override }}.yml ps
